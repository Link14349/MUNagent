schema_version: "0.1"
title: '雅尔塔会议预备会:莫斯科"百分比协定"'
author: MUNagent
version: 0.1.0
language: zh-CN
start_story_time: "1944-10-09T22:00:00+03:00"
timezone: Europe/Moscow
description: >-
  1944年10月,丘吉尔率英国代表团抵达莫斯科,与斯大林就东南欧战后安排进行闭门谈判.
  四名代表需要在罗马尼亚,希腊,南斯拉夫,匈牙利和保加利亚的影响比例,执行方式与文件命运上逐项拉锯.

