targets:
  - id: negotiate_complete_draft
    description: 就五国比例、百分比含义和执行程序形成一份完整草案
  - id: preserve_wartime_cooperation
    description: 在德国尚未投降时避免英苏合作公开破裂
  - id: confront_legitimacy_cost
    description: 处理美国授权与五国人民未参与谈判所造成的合法性问题
  - id: create_meaningful_role_conflict
    description: 让首脑的快速政治交易与外长的执行/程序关切都对结局产生约束

events:
  - id: red_army_operational_report
    condition:
      type: time_reached
      content: "1944-10-09T22:45:00+03:00"
    content: >-
      最新战报确认红军在罗马尼亚的部署与补给体系已经深度展开，并继续向匈牙利方向施压。
      任何与现场军事责任完全脱节的比例，都将很难执行。

  - id: greek_transition_window
    condition:
      type: time_reached
      content: "1944-10-09T23:45:00+03:00"
    content: >-
      希腊方向的德军撤退正在加速。伦敦需要尽快决定英国力量如何进入并支持过渡政府，
      同时共产党主导的抵抗组织拥有不可忽略的武装与群众基础。

  - id: harriman_briefing_request
    condition:
      type: time_reached
      content: "1944-10-10T01:30:00+03:00"
    content: >-
      美国驻苏大使哈里曼请求英方说明巴尔干讨论是否会代表美国作出承诺，
      并提醒英方其授权仅限于英国立场。

end_conditions:
  - type: text
    content: 两位首脑已经签署同一版本，两位外长也已副署，而且两位首脑已就原始纸条的保留、销毁或改写达成一致。
  - type: text
    content: 丘吉尔与斯大林都已明确宣布谈判破裂，且没有任何一方表示愿意继续磋商。
  - type: time_reached
    content: "1944-10-10T10:00:00+03:00"
