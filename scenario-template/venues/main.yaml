id: kremlin_private_study
name: 克里姆林宫闭门会谈室
timezone: Europe/Moscow
description: >-
  四名代表围桌进行不公开谈判.房间内没有新闻记者,也没有来自五个相关国家的代表;
  会议记录,纸条与对外口径本身都是谈判对象.

chair:
  rep: none
  powers:
    decide_resolution: false
    decide_switch_phase: false
session_phase: unchaired_core

seats:
  - winston_churchill
  - joseph_stalin
  - anthony_eden
  - vyacheslav_molotov

initial_agenda: meaning_of_percentages
agenda:
  - id: meaning_of_percentages
    title: 百分比的性质与适用边界
    questions:
      - '是否接受用百分比描述英苏在五国的责任或影响,还是应改用"主要责任""共同磋商"等文字?'
      - 百分比表示当前战争阶段的临时安排,还是可能延续到停战,组阁,选举和缔结和约阶段?
      - 多数份额是否意味着最终决定权,少数份额是否仍包含知情,观察,交涉,提议和异议权?
      - 百分比能否影响当地政府组成,政党活动和王室问题,还是只能约束英苏两国自己的行为?
      - '"英国及其他盟国"的份额能否在美国尚未同意时写入正式文本?'
      - 五国是否必须使用同一种解释,还是可以根据各国军事与政治现实分别定义?

  - id: romania
    title: 罗马尼亚的苏联主导与盟国参与
    questions:
      - 是否接受罗马尼亚以苏联90%,英国及其他盟国10%作为起点,还是需要调整数字?
      - 红军已经承担主要军事和停战责任,是否足以使苏联拥有管制机构中的最终执行权?
      - 英国和美国代表能否直接接触罗马尼亚政府,取得报告并提出意见,还是只能通过苏联方面转达?
      - 苏联的高比例是否仅适用于军事与停战事务,还是也包括政府改组,政党活动和外交承认?
      - 北特兰西瓦尼亚,赔偿,石油和交通设施等问题是否属于百分比安排,还是应留给三国及未来和会处理?
      - 罗马尼亚安排在什么时间或条件下复审,战争结束后是否自动转为更平等的盟国协商?

  - id: greece
    title: 希腊的英国主导与国内政治风险
    questions:
      - 是否接受希腊以苏联10%,英国及其他盟国90%作为起点,英国能够接受的最低主导程度是多少?
      - 苏联承认英国主要责任,是否意味着不向特定希腊政治或武装力量提供援助,指示或外交支持?
      - 英国的高比例是否只保障登陆,救济和治安行动,还是允许英国影响民族团结政府与军队重组?
      - EAM/ELAS拥有真实武装和群众基础,协议应如何避免把英国主导解释成排除全部左翼力量?
      - 国王回国,摄政或未来公投是否应明确留给希腊人决定,不受百分比直接支配?
      - 若希腊各派发生冲突,苏联的克制义务和英国使用武力的边界应如何表述?

  - id: yugoslavia
    title: 南斯拉夫的对等影响与铁托的自主力量
    questions:
      - 是否维持英苏50/50,还是根据游击队与红军的战场贡献修改比例?
      - 50/50表示英苏共同磋商,共同支持联合政府,还是任何一方都可以分别同当地力量合作?
      - 英国继续支持舒巴希奇和王室政府,苏联继续同铁托合作的边界分别是什么?
      - 英苏是否能够承诺铁托,游击队或其他南斯拉夫力量的行为,若不能,协议应怎样写明这种限制?
      - 未来政府应如何容纳游击队,王室政府以及塞尔维亚,克罗地亚,斯洛文尼亚等不同政治与民族力量?
      - 亚得里亚海港口,多瑙河交通和盟军军事行动是否需要另行建立协调办法?

  - id: hungary
    title: 匈牙利退出战争与快速变化的战场
    questions:
      - 丘吉尔提出的50/50是否仍符合红军正在推进,匈牙利秘密寻求停战的现场现实?
      - 匈牙利停战条件应由英美苏共同制定,还是由苏联先行谈判后交盟国确认?
      - 苏联主持联合军事任务或未来管制机构时,英国和美国代表应拥有哪些独立工作权?
      - 如何处理匈牙利同德国断交,对德作战,外国军队通行和撤出战时占领领土等紧急要求?
      - 北特兰西瓦尼亚争端是否应同停战分开,避免罗马尼亚和匈牙利借军事贡献预先决定边界?
      - 若德国阻止匈牙利退出战争或当地政权更替,已经商定的百分比是否仍然有效?

  - id: bulgaria
    title: 保加利亚停战,撤军与管制权限
    questions:
      - 是否接受苏联75%,英国及其他盟国25%的起始比例,还是应改为其他数字?
      - 保加利亚从希腊和南斯拉夫撤军,返还财产及提供赔偿是否应成为停战的明确前提?
      - 苏联最高指挥机关对保加利亚军队,铁路,港口和通信设施的使用权应持续到什么时候?
      - 英国和美国在盟国管制机构中是参与讨论,独立调查,还是在战争结束后取得共同决定权?
      - 祖国阵线政府对德作战能否换取较轻条件,又如何避免把旧政府责任直接转化为对全国政治的无限干预?
      - 保加利亚安排如何同时回应苏联黑海安全,英国对希腊安全的关切以及南斯拉夫的赔偿要求?

  - id: cross_country_balance
    title: 五国之间的整体交换
    questions:
      - 希腊的英国主导与罗马尼亚的苏联主导能否构成双方都承认的核心交换?
      - 一方在某国提高份额时,应在另一国降低份额,还是可以通过程序保障而不是数字补偿?
      - 匈牙利和保加利亚是否应使用相同比例,还是分别依照战场,停战进度和对外责任处理?
      - 南斯拉夫的50/50能否作为整体平衡点,还是它会因为铁托不受完全控制而成为虚假对等?
      - 是否需要为每国分别记录数字,解释和例外,防止一项让步被扩张适用于全部东南欧?
      - 哪些问题可以立即成交,哪些问题必须暂时保留并交未来三国会议复审?

  - id: implementation
    title: 执行,监督与异议处理
    questions:
      - 谁负责把首脑间谅解传达给军方,外交部门和盟国管制机构?
      - 多数方可以采取哪些行动而无需事先同少数方协商,哪些行动必须提前通知?
      - 少数方是否有权派驻人员,接触当地政府,查阅报告,调查执行情况并提交书面异议?
      - 当英苏对同一比例的含义发生争议时,由首脑,外长还是未来三国磋商解决?
      - 紧急军事行动是否可以先执行后通报,若可以,应设定怎样的范围和补充说明义务?
      - 安排应在德国投降,正式和约,当地选举或某个固定日期到来时终止或复审?

  - id: legitimacy_and_united_states
    title: 美国授权与五国政治自主
    questions:
      - 英国应在签署前征询美国,还是可以先形成仅约束英苏的临时谅解再向美国说明?
      - 若美国拒绝接受百分比语言,英苏协议是否继续有效,应否自动转为三国磋商提案?
      - '文本应使用"英国份额",还是可以使用"英国及其他盟国"而不暗示美国已经授权?'
      - 五国人民和政府均未参加会谈,文本应如何承认它不能替代当地政治选择,选举或正式和约?
      - 是否需要明确禁止利用份额扶植排他的单一政党政府,或者这种限制会被视为干涉现场安全?
      - 如果协议内容外泄,双方准备以临时军事协调,政治磋商还是势力范围交易向盟国解释?

  - id: final_text_and_disposition
    title: 最终文本,复审承诺与纸条处置
    questions:
      - 最终成果是一张仅列比例的首脑记录,一份带解释条款的备忘录,还是留待三国确认的谈判草案?
      - 五国数字,百分比定义,执行办法,美国保留和复审安排是否写在同一文本中?
      - 两位首脑的认可与两位外长对执行文字的认可应如何体现在文件上?
      - 是否需要注明安排是临时的,秘密的,不构成正式和约,也不代表五国人民同意?
      - 原始手写纸条应保存为会谈记录,销毁以减少泄密风险,还是由正式备忘录取代?
      - 若部分国家达成一致,部分国家仍有分歧,是否形成部分协议,还是宣布整体谈判未完成?
