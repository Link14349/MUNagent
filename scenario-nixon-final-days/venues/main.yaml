id: white_house_situation_room
name: 白宫战情室绝密磋商
timezone: America/New_York
description: >-
  四人以评估华约异常军事通信为名，在无记录员、无军方值班官和无总统本人参加的条件下闭门磋商。
  基辛格控制发言次序与阶段切换；任何书面成果都必须区分合法命令、内部建议和交接预案。

chair:
  rep: henry_kissinger
  powers:
    decide_resolution: false
    decide_switch_phase: true
session_phase: chaired_core

seats:
  - henry_kissinger
  - james_schlesinger
  - alexander_haig
  - gerald_ford

initial_agenda: soviet_posture
agenda:
  - id: soviet_posture
    title: 华约异常动向与美国对外姿态
    questions:
      - 现有情报能否证明苏联或华约正在利用华盛顿政治危机，还是仅为例行活动与分析噪声？
      - 美国应通过外交照会、驻外部队戒备、公开声明还是保持沉默来传递政府仍能履行承诺？
      - 哪些戒备措施可以由既有授权执行，哪些必须取得总统明确决定？
      - 如何避免一次为展示连续性而采取的军事动作被莫斯科误读为政权危机中的升级？
      - 对苏联、北约盟国、中国及驻外使馆是否应使用同一套口径？

  - id: command_authentication
    title: 异常军事指令的认证、合法性与执行链
    questions:
      - 若白宫直接联系作战单位或绕过常规程序，值班军官应如何核验身份、权限与命令真实性？
      - 认证总统身份、审查命令合法性与判断总统能力，是三个怎样不同的问题？
      - 国防部长与参谋长联席会议主席可以要求哪些复核，又有哪些做法会构成擅自增加否决人？
      - 在核袭击警报只有数分钟的情况下，如何兼顾快速反应与防止误传、醉酒口授或幕僚冒名？
      - 哪些临时措施必须留存书面记录、设定失效时点并向继任总统重新报告？

  - id: presidential_incapacity
    title: 总统能力、第二十五修正案与宪法红线
    questions:
      - 哪些可观察事实足以触发正式能力评估，哪些只是政治失败、疲惫或令人不安的传闻？
      - 是否应先劝总统依据第二十五修正案第3款自愿暂时移交权力？
      - 若考虑第4款，福特和内阁应获得什么信息，谁负责召集，如何防止四人小组替代法定主体？
      - 总统若反对“无能力”判断，四人是否准备面对国会时限、公开争议和指挥链双重声称？
      - 弹劾、辞职与无能力程序分别解决什么问题，能否为追求速度而相互替代？

  - id: resignation_and_transition
    title: 辞职劝说与权力交接准备
    questions:
      - 海格应如何向尼克松说明国会票数、辞职选项与交接安排，而不以赦免或其他交易施压？
      - 福特可以提前批准哪些交接准备，又应拒绝参与哪些可能被解释为逼宫或交换条件的接触？
      - 若辞职信尚未签署，对外通知、核指挥简报、军事助理移交和宣誓安排可以准备到什么程度？
      - 基辛格和施莱辛格是否留任，应由谁决定；他们怎样避免用连续性承诺预先约束新总统？
      - 若尼克松临时反悔或决定接受参议院审判，已经建立的临时保护措施如何撤销或改走正式程序？

  - id: final_memorandum
    title: 最终备忘录、期限与责任留痕
    questions:
      - 四人能否共同形成一份不剥夺总统法定权力、却能处理异常指令的书面流程？
      - 文件应分别列明情报评估、认证步骤、合法性审查、能力程序和交接清单吗？
      - 谁负责向总统报告，谁负责向参联会、内阁成员和军事助理传达，哪些内容必须严格限知？
      - 备忘录何时自动失效，辞职、第二十五修正案启动或政治危机缓解后由谁复审？
      - 如何留下足以审计的记录，同时防止文件泄露后被解释为内阁成员秘密夺权？
